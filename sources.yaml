    layer: "L2"
    vorlauf_monate: 1
    zugang: "offen/API (data.sec.gov, User-Agent-Pflicht)"
    kosten: "kostenlos"
    aktualisierung: "quartalsweise (10-K/10-Q), laufend (Form 4)"
    zuverlaessigkeit: "hoch"
    lizenz: "public domain (US-Regierung)"
