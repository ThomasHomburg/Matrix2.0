# Quellenregister Trend-Layer (trends.py, v54) -- Seed fuer Tabelle `sources`.
# Felder: name, layer (L1 Wissenschaft/Technologie, L2 Markt/Kapital,
# L3 Regulierung/Politik, L4 Nachfrage/Cross-Industry), vorlauf_monate, zugang,
# kosten, aktualisierung, zuverlaessigkeit, lizenz.
# Kein Datenabruf in Teil A -- das Register beschreibt nur die Quellen.
sources:
